name: Deploy to Production

on:
  push:
    branches:
      - produccion

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Generate .env on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cat > ~/eminsa.com/.env << 'ENVEOF'
            NODE_ENV=production
            APP_ENV=PROD
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            SALES_EMAIL=${{ secrets.SALES_EMAIL }}
            BCC_EMAIL=${{ secrets.BCC_EMAIL }}
            ENVEOF
            chmod 600 ~/eminsa.com/.env

      - name: Backup de la base de datos (mysqldump, SOLO lectura) antes de cualquier cambio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            cd ~/eminsa.com
            echo "== Backup de BD (mysqldump = solo lectura; no modifica ni borra datos) =="

            if ! command -v mysqldump >/dev/null 2>&1; then
              echo "ERROR: mysqldump no esta disponible en el servidor. Abortando: no se hace deploy sin backup."
              exit 1
            fi

            mkdir -p backups

            DBURL="$(grep -m1 '^DATABASE_URL=' .env | sed 's/^DATABASE_URL=//; s/^"//; s/"$//' | tr -d '\r')"
            export DBURL
            if [ -z "${DBURL:-}" ]; then
              echo "ERROR: no se encontro DATABASE_URL en .env. Abortando (no se toca nada)."
              exit 1
            fi

            node -e "const{execFileSync}=require(\"child_process\");const fs=require(\"fs\");const u=new URL(process.env.DBURL);const db=u.pathname.replace(/^\//,\"\").split(\"?\")[0];const ts=new Date().toISOString().replace(/[:.]/g,\"-\").slice(0,19);const out=\"backups/\"+db+\"-\"+ts+\".sql\";const fd=fs.openSync(out,\"w\");execFileSync(\"mysqldump\",[\"--host=\"+u.hostname,\"--port=\"+(u.port||\"3306\"),\"--user=\"+decodeURIComponent(u.username),\"--single-transaction\",\"--quick\",\"--no-tablespaces\",\"--skip-lock-tables\",db],{env:Object.assign({},process.env,{MYSQL_PWD:decodeURIComponent(u.password)}),stdio:[\"ignore\",fd,\"inherit\"]});fs.closeSync(fd);const size=fs.statSync(out).size;const head=fs.readFileSync(out,\"utf8\").slice(0,4096);if(size<100||!head.includes(\"CREATE TABLE\")){console.error(\"ERROR: backup vacio o incompleto\");process.exit(1);}execFileSync(\"gzip\",[\"-f\",out]);console.log(\"Backup OK -> \"+out+\".gz\");"

            echo "Backups guardados (mas recientes):"
            ls -1t backups/*.sql.gz 2>/dev/null | head -5 || true

      - name: Deploy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".next,public,prisma,package.json,package-lock.json,server.js,next.config.ts,ecosystem.config.js,src/messages,src/i18n"
          target: "/home/eminsa/eminsa.com"
          rm: false
          overwrite: true

      - name: Install deps, migrate DB, restart Passenger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/eminsa.com

            # Set permissions
            chmod -R 755 .next

            # Install production dependencies
            npm install --production

            # Generate Prisma client for server architecture
            npx prisma generate

            # Sync DB schema (safe, non-destructive)
            npx prisma db push --skip-generate

            # Ensure tmp directory exists and restart Passenger
            mkdir -p tmp
            touch tmp/restart.txt

            echo "Deploy completado exitosamente"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://eminsa.com || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Health check OK (HTTP $HTTP_CODE)"
            else
              echo "Health check FAILED (HTTP $HTTP_CODE)"
              tail -30 ~/logs/error.log 2>/dev/null
              exit 1
            fi
